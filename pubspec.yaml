name: spotit_flutter_app
description: SpotIt - Mobile Local Hazard and Issue Reporting App with Real-Time Map & Firebase Connection

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # Firebase Services
  firebase_core: ^2.32.0
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.17.5
  
  # Map & Geolocation (Leaflet-like matching Web app)
  flutter_map: ^6.1.0
  latlong2: 0.9.1
  geolocator: ^14.0.2
  http: ^1.1.2 # For address geocoding (Nominatim API matching web)
  
  # UI & Presentation
  lucide_icons: ^0.257.0
  google_fonts: ^6.1.0
  image_picker: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
